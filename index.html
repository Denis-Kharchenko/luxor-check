<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Счёт LUXOR, стол 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Layout: one narrow column like a till receipt; sticky pay bar at the bottom. Committed dark "karaoke at night" look. */
:root {
  color-scheme: dark;
  --bg: #15111c;
  --surface: #1f1929;
  --line: #352c42;
  --fg: #f1ebf7;
  --muted: #a397b3;
  --accent: #f2b544;      /* Luxor gold */
  --accent-ink: #1b1306;
  --pink: #ff6fa8;        /* karaoke neon, used once */
  --ok: #6fdba0;
  --f-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font: 15px/1.45 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 0;
}
.wrap { max-width: 520px; margin: 0 auto; display: grid; gap: 20px; padding-bottom: 210px; }
header { display: grid; gap: 6px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { font: 700 30px/1.05 var(--f-display); margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
.meta { color: var(--muted); font-size: 13px; }
.meta b { color: var(--fg); font-weight: 500; }

.name label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
input[type=text] {
  width: 100%; font: 500 16px var(--f-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
input[type=text]:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

h2 { font: 700 13px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 6px 0 0; }
.hint { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.list { display: grid; border-top: 1px dashed var(--line); }
.row { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.row .t { min-width: 0; }
.row .n { font-weight: 500; }
.row .p { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row.on .n { color: var(--accent); }

.step { display: flex; align-items: center; gap: 4px; }
.step button {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: 700 20px/1 var(--f-body); cursor: pointer;
}
.step button:disabled { opacity: .3; cursor: default; }
.step output { min-width: 28px; text-align: center; font: 700 16px var(--f-mono); font-variant-numeric: tabular-nums; }

.pay-in { max-width: 520px; margin: 0 auto; display: grid; gap: 10px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sum .lbl { font-size: 13px; color: var(--muted); }
.sum .lbl small { display: block; font: 12px var(--f-mono); }
.sum .big { font: 700 34px/1 var(--f-display); color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn {
  display: flex; align-items: center; justify-content: center; gap: 6px; text-align: center;
  min-height: 46px; padding: 8px 12px; border-radius: 12px; font: 700 14px var(--f-body);
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none;
}
.btn.primary { grid-column: 1 / -1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-size: 16px; }
.btn.primary[aria-disabled=true] { opacity: .45; pointer-events: none; }
.phone { font: 500 13px var(--f-mono); color: var(--muted); text-align: center; user-select: all; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(220px + env(safe-area-inset-bottom, 0px));
  background: var(--ok); color: #0c2417; font-weight: 700; padding: 8px 14px; border-radius: 999px; font-size: 13px;
  z-index: 30; transition: opacity .2s;
}
button.btn.primary { border: 0; }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgb(8 5 12 / .7); display: flex; align-items: flex-end; justify-content: center; }
.sheet-in {
  width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: grid; gap: 14px;
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet-head h3 { margin: 0; font: 700 18px/1.2 var(--f-display); }
.x { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font-size: 20px; cursor: pointer; }
.banks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.bank { justify-content: flex-start; background: var(--bg); }
.bank i { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c); }
.bank[aria-current=true] { border-color: var(--accent); color: var(--accent); }
.steps { margin: 0; padding: 12px 14px 12px 32px; background: var(--bg); border-radius: 12px; display: grid; gap: 6px; font-size: 14px; }
.steps b { color: var(--accent); }
.sheet .btns { grid-template-columns: 1fr 1fr; }
#lists { display: grid; gap: 20px; }
.err { margin: 0; padding: 12px 14px; border-radius: 12px; background: color-mix(in srgb, var(--pink) 18%, var(--surface)); color: var(--fg); }
.newbill { color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; justify-self: start; }
.foot { display: flex; gap: 8px; flex-wrap: wrap; }
.foot .btn { flex: 1 1 160px; }
.note { font-size: 12px; color: var(--muted); }
.note b { color: var(--pink); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1>Что ты <span>брал?</span></h1>
    <div class="meta" id="meta"></div>
  </header>
  <p class="err" id="linkError" hidden>Ссылка на счёт повреждена. Попроси организатора прислать её ещё раз.</p>

  <div class="name">
    <label for="who">Как тебя зовут</label>
    <input id="who" type="text" placeholder="Например, Маша" autocomplete="given-name">
  </div>

  <div id="lists"></div>

  <div class="foot">
    <button class="btn" id="share" type="button">Скопировать мой список для чата</button>
    <button class="btn" id="reset" type="button">Сбросить</button>
  </div>
  <p class="note" id="note"></p>
  <a class="newbill" href="new.html">Сделать такую страницу для своего чека →</a>
</div>

<div class="pay">
  <div class="pay-in">
    <div class="sum">
      <div class="lbl">К переводу<small id="breakdown">0 ₽ + 50 ₽ сбор</small></div>
      <div class="big" id="total">0 ₽</div>
    </div>
    <div class="btns">
      <button class="btn primary" id="open" type="button" aria-disabled="true">Перевести</button>
      <button class="btn" id="copyPhone" type="button">Копировать номер</button>
      <button class="btn" id="copySum" type="button">Копировать сумму</button>
    </div>
    <div class="phone" id="phoneLine"></div>
  </div>
</div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h3 id="sheetTitle">Из какого банка переводишь?</h3>
      <button class="x" id="sheetClose" type="button" aria-label="Закрыть">×</button>
    </div>
    <div class="banks" id="banks"></div>
    <a class="btn primary" id="siteLink" href="#" target="_blank" rel="noopener" hidden></a>
    <ol class="steps" id="steps"></ol>
    <div class="btns">
      <button class="btn" id="sheetPhone" type="button">Копировать номер</button>
      <button class="btn" id="sheetSum" type="button">Копировать сумму</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="bill.js"></script>
<script>
// Счёт по умолчанию: первый чек, LUXOR. Любой другой приходит в ссылке после #.
const LUXOR = {
  v: 1, t: "Караоке-бар LUXOR", s: "стол 10 · 17.10.2026", p: "+79224261875", b: "tbank", f: 50, T: 9580,
  i: [
    ["Пина-колада", 1, 350, "Напитки"], ["Зелёный дракон", 1, 360, "Напитки"], ["Лонг-Айленд", 4, 2280, "Напитки"],
    ["Чай с чабрецом", 1, 350, "Напитки"], ["Авторский коктейль", 1, 520, "Напитки"], ["Чешское тёмное 0,5", 5, 1250, "Напитки"],
    ["Апероль шприц", 3, 2040, "Напитки"], ["Секс на пляже", 1, 340, "Напитки"], ["Чай зелёный", 1, 350, "Напитки"],
    ["Блю лика", 1, 310, "Напитки"],
    ["Гренки с сыром и чесноком", 1, 280, "Еда"], ["Картофель айдахо", 2, 500, "Еда"],
    ["Соус сырный", 1, 70, "Еда"], ["Хачапури по-мегрельски", 1, 580, "Еда"],
  ],
};
const GROUP_ORDER = ["Напитки", "Еда", "Другое"];

let B = LUXOR, KEY = "luxor-10-2026-10-17-v3";
let state = { who: "", c: {} };
let bank = "", fallback = false, appTimer;

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const rub = n => Math.round(n).toLocaleString("ru-RU") + " ₽";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const recipientBank = () => bankName(B.b) || "банк получателя";

function renderHead() {
  document.title = `Счёт: ${B.t}`;
  $("eyebrow").textContent = [B.t, B.s].filter(Boolean).join(" · ");
  const fee = B.f ? ` Сервисный сбор: <b>${rub(B.f)}</b> с человека.` : "";
  const total = B.T ? ` Весь чек: <b>${rub(B.T)}</b>.` : "";
  $("meta").innerHTML = `Отметь своё, и страница посчитает, сколько перевести.${total}${fee}`;
  $("phoneLine").textContent = `${showPhone(B.p)} · ${recipientBank()}`;
  $("note").innerHTML = `Перевод по номеру телефона, получатель в банке «${esc(recipientBank())}». Если приложение не открылось само, открой его вручную: <b>Платежи → По номеру телефона</b>.`;
}

function renderLists() {
  const groups = {};
  B.i.forEach((it, i) => { const g = GROUP_ORDER.includes(it[3]) ? it[3] : "Другое"; (groups[g] = groups[g] || []).push(i); });
  const names = GROUP_ORDER.filter(g => groups[g]);
  $("lists").innerHTML = names.map(g => `<section>
    <h2>${names.length > 1 ? g : "Позиции"}</h2>
    <p class="hint">Сколько штук взял ты сам.</p>
    <div class="list">${groups[g].map(i => {
      const [n, q, s] = B.i[i], c = state.c[i] || 0;
      return `<div class="row${c ? " on" : ""}">
        <div class="t"><div class="n">${esc(n)}</div><div class="p">${rub(s / q)} за шт.${q > 1 ? ` · в чеке ${q} шт.` : ""}</div></div>
        <div class="step">
          <button type="button" data-i="${i}" data-x="-1" aria-label="Меньше: ${esc(n)}" ${c ? "" : "disabled"}>−</button>
          <output>${c}</output>
          <button type="button" data-i="${i}" data-x="1" aria-label="Больше: ${esc(n)}" ${c >= q ? "disabled" : ""}>+</button>
        </div></div>`;
    }).join("")}</div></section>`).join("");
}

function lines() {
  return B.i.map(([n, q, s], i) => [n, state.c[i] || 0, s / q]).filter(l => l[1]).map(([n, c, u]) => [`${n} ×${c}`, c * u]);
}
function totals() {
  const items = Math.ceil(lines().reduce((a, [, v]) => a + v, 0));
  return { items, total: items ? items + (B.f || 0) : 0 };
}

function renderPay() {
  const { items, total } = totals();
  $("total").textContent = rub(total);
  $("breakdown").textContent = B.f ? `${rub(items)} + ${B.f} ₽ сбор` : "без сервисного сбора";
  const open = $("open");
  open.setAttribute("aria-disabled", total ? "false" : "true");
  open.textContent = total ? `Перевести ${rub(total)}` : "Отметь, что брал";
}

function renderSheet() {
  const { total } = totals();
  $("banks").innerHTML = BANKS.map(([id, name, c]) =>
    `<button class="btn bank" type="button" data-bank="${id}" style="--c:${c}" aria-current="${bank === id}"><i></i>${name}</button>`
  ).join("");
  const b = BANKS.find(x => x[0] === bank);
  const site = $("siteLink");
  site.hidden = !(fallback && b && b[4]);
  if (b && b[4]) { site.href = b[4]; site.textContent = `Приложение не открылось? Открыть сайт: ${b[1]}`; }
  const own = bank && bank === B.b;
  $("steps").innerHTML = [
    "Открой приложение своего банка, раздел <b>Платежи → По номеру телефона</b>",
    `Номер: <b>${showPhone(B.p)}</b>`,
    own ? `Получатель тоже в банке «${esc(recipientBank())}», банк выбирать не нужно`
        : `Банк получателя: <b>${esc(recipientBank())}</b> (перевод через СБП)`,
    `Сумма: <b>${rub(total)}</b>${bank ? ", уже скопирована, просто вставь" : ""}`,
  ].map(s => `<li>${s}</li>`).join("");
}
function openSheet() {
  if (!totals().total) return;
  renderSheet(); $("sheet").hidden = false; $("sheetClose").focus();
}
function closeSheet() { $("sheet").hidden = true; $("open").focus(); }
function render() { renderLists(); renderPay(); save(); }

let tt;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 1800);
}
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
    ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
    ta.remove(); toast(ok ? msg : "Не удалось скопировать: " + text);
  }
}

$("lists").addEventListener("click", e => {
  const b = e.target.closest("button[data-i]");
  if (!b) return;
  const i = +b.dataset.i, q = B.i[i][1];
  state.c[i] = Math.max(0, Math.min(q, (state.c[i] || 0) + +b.dataset.x));
  render();
});
$("who").addEventListener("input", e => { state.who = e.target.value.trim(); save(); });
$("copyPhone").addEventListener("click", () => copy(B.p, "Номер скопирован"));
$("copySum").addEventListener("click", () => copy(String(totals().total), "Сумма скопирована"));
$("open").addEventListener("click", openSheet);
$("sheetClose").addEventListener("click", closeSheet);
$("sheet").addEventListener("click", e => { if (e.target === $("sheet")) closeSheet(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
$("sheetPhone").addEventListener("click", () => copy(B.p, "Номер скопирован"));
$("sheetSum").addEventListener("click", () => copy(String(totals().total), "Сумма скопирована"));
// Копируем сумму и пробуем открыть приложение банка; если не вышло, предлагаем сайт.
$("banks").addEventListener("click", e => {
  const b = e.target.closest("[data-bank]");
  if (!b) return;
  bank = b.dataset.bank; fallback = false;
  const sum = String(totals().total);
  try { navigator.clipboard.writeText(sum).then(() => toast("Сумма скопирована"), () => {}); } catch (_) {}
  renderSheet();
  const code = BANKS.find(x => x[0] === bank)[3];
  if (!code) return;
  clearTimeout(appTimer);
  // Если через 2 секунды страница всё ещё на экране, приложение не открылось.
  appTimer = setTimeout(() => {
    if (document.visibilityState === "visible") { fallback = true; renderSheet(); }
  }, 2000);
  location.href = `bank${code}://`;
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") clearTimeout(appTimer); });
window.addEventListener("pagehide", () => clearTimeout(appTimer));
$("share").addEventListener("click", () => {
  const ls = lines(), { items, total } = totals();
  if (!ls.length) { toast("Сначала отметь, что брал"); return; }
  const text = `${state.who || "Я"} — ${[B.t, B.s].filter(Boolean).join(", ")}:\n` +
    ls.map(([n, v]) => `• ${n} — ${rub(Math.ceil(v))}`).join("\n") +
    `\nИтого: ${rub(items)}${B.f ? ` + ${B.f} ₽ сбор = ${rub(total)}` : ""}\nПеревожу на ${showPhone(B.p)} (${recipientBank()})`;
  copy(text, "Список скопирован, вставь в чат");
});
$("reset").addEventListener("click", () => { state.c = {}; render(); toast("Всё сброшено"); });

async function boot() {
  const code = location.hash.slice(1);
  if (code) {
    try { B = await decodeBill(code); KEY = "bill-" + [...code].reduce((h, ch) => (h * 33 + ch.charCodeAt(0)) >>> 0, 5381).toString(36); }
    catch (e) { $("linkError").hidden = false; }
  }
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.c) state = s; } catch (e) {}
  $("who").value = state.who || "";
  renderHead(); render();
}
window.addEventListener("hashchange", () => location.reload());
boot();
</script>
</body>
</html>
